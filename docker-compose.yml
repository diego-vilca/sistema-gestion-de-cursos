services:
  db:
    image: postgres:16
    container_name: postgres_db

    environment:
      # 🔹 Nombre más representativo
      POSTGRES_DB: api_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      # Solo si querés acceder desde host (ej: DBeaver)
      - "5433:5432"

  app:
    build: .
    container_name: api_app

    depends_on:
      - db

    ports:
      - "8080:8080"

    environment:
      # 🔹 Spring toma estas variables automáticamente
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/api_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass

volumes:
  postgres_data:
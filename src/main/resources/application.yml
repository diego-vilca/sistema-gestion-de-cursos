spring:
  application:
    name: gestion-cursos
  
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Cambiar a 'validate' si Flyway gestiona el esquema
    hibernate:
      # ddl-auto: create
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        # Utilizo "[]" para evitar problemas de formato con YAML
        "[format_sql]": true
